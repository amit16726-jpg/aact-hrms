# AACT HRMS — company server. TLS ends here; the app and the Supabase API share one address,
# so the browser never needs cross-site requests. Supabase Studio is NOT exposed (use an SSH tunnel).

server {
  listen 80;
  server_name _;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 25m;          # document uploads (bucket limit is 10 MB per file)
  server_tokens off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Supabase API (Kong) — same names as the cloud: /rest/v1, /auth/v1, /storage/v1, /functions/v1, /realtime/v1
  location ~ ^/(rest|auth|storage|functions|realtime)/v1/ {
    proxy_pass http://supabase-kong:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }

  root /usr/share/nginx/html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  location = /healthz { access_log off; return 200 "ok\n"; }

  # installable app (Android / iPhone): manifest with its own type; the service worker is never cached
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # single-page app: every other path serves index.html (never cached, so updates show at once)
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri /index.html;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
